<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Weather Japan</title>

    <style>
        body{
            margin:0;
            padding:40px;
            text-align:center;
            font-family:"Yu Gothic",sans-serif;

            background:linear-gradient(
                to bottom,
                #bfe8ff,
                #eaf7ff,
                white
            );
        }

        h1{
            color:#2b5ca8;
            font-size:48px;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:40px;
            font-size:18px;
        }

        .region{

            display:flex;
            justify-content:center;
            align-items:center;

            width:320px;
            height:70px;

            margin:18px auto;

            border-radius:20px;

            text-decoration:none;
            font-size:22px;
            font-weight:bold;

            transition:.25s;
        }

        .region:hover{

            transform:translateY(-5px) scale(1.05);

        }

        .hokkaido{
            background:#dceeff;
            color:#1c5aa6;
        }

        .tohoku{
            background:#5B8FF9;
            color:white;
        }

        .kanto{
            background:#8FD3FF;
            color:#003366;
        }

        .chubu{
            background:#98D97B;
            color:#234F1E;
        }

        .kinki{
            background:#F5D76E;
            color:#5A4A00;
        }

        .chugoku{
            background:#F5B66E;
            color:#5A2D00;
        }

        .shikoku{
            background:#F4B6D2;
            color:#6D2246;
        }

        .kyushu{
            background:#F08080;
            color:white;
        }

        footer{
            margin-top:60px;
            color:gray;
            font-size:14px;
        }

        .select-text{
            color: #222;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }
    </style>

</head>

<body>
<h1>天気</h1>
<h3>都道府県を検索</h3>
<form action="/weather" method="get">
   <input
    type="text"
    name="city"
    list="prefectures"
    placeholder="都道府県名を入力（例：愛知、東京）"
>

<datalist id="prefectures">
    <option value="北海道">
    <option value="青森県">
    <option value="岩手県">
    <option value="宮城県">
    <option value="秋田県">
    <option value="山形県">
    <option value="福島県">
    <option value="茨城県">
    <option value="栃木県">
    <option value="群馬県">
    <option value="埼玉県">
    <option value="千葉県">
    <option value="東京都">
    <option value="神奈川県">
    <option value="新潟県">
    <option value="富山県">
    <option value="石川県">
    <option value="福井県">
    <option value="山梨県">
    <option value="長野県">
    <option value="岐阜県">
    <option value="静岡県">
    <option value="愛知県">
    <option value="三重県">
    <option value="滋賀県">
    <option value="京都府">
    <option value="大阪府">
    <option value="兵庫県">
    <option value="奈良県">
    <option value="和歌山県">
    <option value="鳥取県">
    <option value="島根県">
    <option value="岡山県">
    <option value="広島県">
    <option value="山口県">
    <option value="徳島県">
    <option value="香川県">
    <option value="愛媛県">
    <option value="高知県">
    <option value="福岡県">
    <option value="佐賀県">
    <option value="長崎県">
    <option value="熊本県">
    <option value="大分県">
    <option value="宮崎県">
    <option value="鹿児島県">
    <option value="沖縄県">
</datalist>
    <button type="submit">検索</button>
</form>
<p class="select-text">または地域を選択してください</p>

<a href="/hokkaido" class="region hokkaido">
     北海道
</a>

<a href="/tohoku" class="region tohoku">
     東北
</a>

<a href="/kanto" class="region kanto">
     関東
</a>

<a href="/chubu" class="region chubu">
     中部
</a>

<a href="/kinki" class="region kinki">
     近畿
</a>

<a href="/chugoku" class="region chugoku">
     中国
</a>

<a href="/shikoku" class="region shikoku">
     四国
</a>

<a href="/kyushu" class="region kyushu">
     九州
</a>

<p style="font-size:12px;color:gray;">
    天気データ提供
    <a href="https://openweathermap.org/"target="_black">
        openweathermap
    </a>
</p>

</body>
</html>

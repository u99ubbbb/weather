            background:#eef8ff;

        }

        h1{
            color:#2b5ca8;
            font-size:42px;
            font-weight:900;
            margin-bottom:40px;
        }

        .prefecture{
            display:block;
            width:300px;

        .prefecture:hover{

            transform:scale(1.03);
        }

        .back{

            margin-top:40px;

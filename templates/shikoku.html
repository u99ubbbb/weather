<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>四国地方</title>

    <style>

        body{
            font-family:"Noto Sans JP",sans-serif;
            background:#eef8ff;
            text-align:center;
            padding:40px;
        }

        h1{
            color:#2b5ca8;
            font-size:42px;
            font-weight:900;
            margin-bottom:40px;
        }

        .prefecture{
            display:block;
            width:300px;
            margin:15px auto;
            padding:18px;

            background:white;
            color:#333;

            text-decoration:none;

            border-radius:18px;

            font-weight:700;

            transition:.2s;
        }

        .prefecture:hover{
            background:#F4B6D2;
            color:white;
            transform:scale(1.03);
        }

        .back{
            display:inline-block;
            margin-top:40px;
            text-decoration:none;
            color:#2b5ca8;
            font-weight:700;
        }

    </style>
</head>
<body>
<h1>四国地方</h1>
<a class="prefecture" href="/weather/Tokushima">徳島県</a>
<a class="prefecture" href="/weather/Kagawa">香川県</a>
<a class="prefecture" href="/weather/Ehime">愛媛県</a>
<a class="prefecture" href="/weather/Kouchi">高知県</a>
<a class="back" href="/">← 地域選択へ戻る</a>
</body>
</html>
